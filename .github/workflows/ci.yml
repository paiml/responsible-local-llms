name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: { group: tier2, labels: [tier2] }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # pv gate shapes (PV-ONT-014 / F-34) needs a comparand: merge-base(HEAD, origin/main) or origin/main.
          # The default depth-1 merge-ref checkout has neither, so the gate fails with 0 violations.
          fetch-depth: 0
      - name: check host tools (checks only, installs nothing)
        run: |
          host="$(hostname)"
          fail=0
          need() { echo "::error::host $host is missing required tool: $1 ($2)"; fail=1; }
          if command -v pv >/dev/null 2>&1; then
            pv_ver="$(pv --version | head -n1 | sed -E 's/^pv ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')"
            echo "pv version: $pv_ver"
            if [ "$(printf '%s\n0.74\n' "$pv_ver" | sort -V | head -n1)" != "0.74" ]; then
              need pv "found $pv_ver, need >= 0.74"
            fi
          else
            need pv "not on PATH, need >= 0.74"
          fi
          command -v cargo >/dev/null 2>&1 && cargo --version || need cargo "not on PATH"
          cargo llvm-cov --version 2>/dev/null || need "cargo llvm-cov" "cargo-llvm-cov not installed"
          if command -v shellcheck >/dev/null 2>&1; then
            sc_ver="$(shellcheck --version | sed -n 's/^version: //p')"
            echo "shellcheck version: $sc_ver"
            # Makefile used to run koalaman/shellcheck-alpine:v0.10.0; require the same rules natively.
            [ "$sc_ver" = "0.10.0" ] || need shellcheck "found $sc_ver, need 0.10.0 (the version the docker image pinned)"
          else
            need shellcheck "not on PATH, need 0.10.0"
          fi
          exit "$fail"
      - name: lint
        run: make lint-rust
      - name: shellcheck
        run: make lint-shell
      - name: test
        run: make test
      - name: coverage
        run: make coverage
      - name: provable contracts (pv)
        run: make pv
