name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: coverage
        run: make coverage
