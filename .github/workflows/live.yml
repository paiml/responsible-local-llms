name: live (nightly LAB)

# LAB check: cannot block a merge or a release, so it never runs in a PR.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: [self-hosted, Linux, ARM64, gx10, docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: check docker (checks only)
        run: docker info
      - name: test model cache
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: rll-model-qwen3-0.6b-q4_k_m-ac2d97712095a558
      - name: live suite (llama.cpp, Ollama)
        run: make live RUNTIMES="llamacpp ollama"

  # The apr leg. `apr` must already be on the runner's PATH; this job never installs it.
  live-apr:
    name: live-apr
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: check apr (checks only)
        run: |
          command -v apr >/dev/null 2>&1 || { echo "apr is not on PATH on this runner; this job never installs it" >&2; exit 1; }
          apr --version
      - name: test model cache
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: rll-model-qwen3-0.6b-q4_k_m-ac2d97712095a558
      - name: live suite (apr)
        run: make live RUNTIMES="apr"
