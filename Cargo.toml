[workspace]
resolver = "2"
members = ["crates/rll-client", "crates/ch1-sovereign", "crates/ch3-guard"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rll-client = { path = "crates/rll-client" }
